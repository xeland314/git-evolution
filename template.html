<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Evolution — {{ repo_name }}</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #161616;
            --border: #262626;
            --text: #f2f2f2;
            --muted: #8a8a8a;
            --accent: #4fd1c5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            font-family: 'Inter', 'Segoe UI', Tahoma, Verdana, sans-serif;
            color: var(--text);
        }

        header {
            border-bottom: 1px solid var(--border);
            padding: 28px 5% 20px;
        }

        header .eyebrow {
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            margin: 0 0 6px;
        }

        header h1 {
            font-size: 26px;
            margin: 0 0 4px;
            font-weight: 600;
        }

        header p.meta {
            margin: 0;
            font-size: 13px;
            color: var(--muted);
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 24px auto 40px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
        }

        footer {
            text-align: center;
            padding: 18px 5% 32px;
            font-size: 12px;
            color: var(--muted);
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <p class="eyebrow">git-evolution report</p>
        <h1>{{ repo_name }}</h1>
        <p class="meta">Generado el {{ generated_date }} · {{ commit_count }} commits analizados</p>
    </header>

    <div class="container">
        {{ graphic_component }}
    </div>

    <footer>
        Generado con <a href="https://github.com/" target="_blank" rel="noopener">git-evolution</a>
    </footer>
</body>
</html>
